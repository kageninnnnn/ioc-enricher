name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # deny-all default; each job opts in

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LOCAL_IMAGE: ioc-enricher:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint helm/ioc-enricher
          helm lint helm/ioc-enricher --set serviceMonitor.enabled=true \
            --set podDisruptionBudget.enabled=true --set autoscaling.enabled=true \
            --set ingress.enabled=true --set existingSecret=ioc-enricher-keys \
            --set config.redisUrl=redis://redis:6379/0
      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template ioc-enricher helm/ioc-enricher -n ioc-enricher > rendered/default.yaml
          helm template ioc-enricher helm/ioc-enricher -n ioc-enricher \
            --set serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true \
            --set autoscaling.enabled=true --set ingress.enabled=true \
            --set existingSecret=ioc-enricher-keys \
            --set config.redisUrl=redis://redis:6379/0 > rendered/full.yaml
      - name: Kubeconform (schema validation)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ k8s/policies/

  test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tarball)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # ---------------- security gates (parallel) ----------------
  gitleaks:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the full history, not just HEAD
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git --config /repo/.gitleaks.toml --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif /repo
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true  # SARIF upload needs GHAS on private repos

  semgrep:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        run: |
          semgrep scan --config p/python --config p/owasp-top-ten \
            --severity ERROR --error --sarif --output semgrep.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy-fs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (SCA) - SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem (SCA) - gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  trivy-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - name: Trivy image - SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image - gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  dast:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - name: Start API container
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e RATE_LIMIT_PER_MINUTE=100000 "$LOCAL_IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: OWASP ZAP API scan (OpenAPI)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -v "$PWD/.zap/rules.tsv:/zap/wrk/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:8000/openapi.json -f openapi \
            -c rules.tsv -r zap-report.html -J zap-report.json -I || true
          # Gate: fail only on High-risk alerts (riskcode 3); Medium/Low are reported.
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap/zap-report.json)
          echo "High-risk alerts: $HIGH"
          jq -r '.site[].alerts[] | "[\(.riskdesc)] \(.name) (\(.pluginid))"' zap/zap-report.json
          test "$HIGH" -eq 0
      - name: API logs
        if: always()
        run: docker logs api || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
          retention-days: 14

  # ---------------- publish (main only, all gates green) ----------------
  publish:
    needs: [helm, gitleaks, semgrep, trivy-fs, trivy-image, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # OIDC token for cosign keyless
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the exact image that was scanned
        run: docker load -i "${{ runner.temp }}/image.tar"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & push
        id: push
        run: |
          IMAGE="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          docker tag "$LOCAL_IMAGE" "$IMAGE:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Cosign keyless sign (by digest)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"
      - name: Generate SBOM (SPDX) and attach as signed attestation
        run: |
          syft "${{ steps.push.outputs.ref }}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.push.outputs.ref }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

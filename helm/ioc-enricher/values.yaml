replicaCount: 1

image:
  repository: ghcr.io/kageninnnnn/ioc-enricher
  # Defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
#  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Name of an existing Secret (e.g. created by a SealedSecret). All of its keys are
# injected with envFrom (optional), so any subset of these may be present:
#   ABUSEIPDB_API_KEY, VIRUSTOTAL_API_KEY, OTX_API_KEY, ABUSECH_AUTH_KEY, API_KEYS
# Backward compat: a v0.1 Secret holding only ABUSEIPDB_API_KEY keeps working as-is.
# (`existingSecretKey` from v0.1 is no longer used - name the key ABUSEIPDB_API_KEY.)
existingSecret: ""

# Non-secret runtime configuration, rendered as env vars
config:
  cacheTtlSeconds: 3600
  rateLimitPerMinute: 60
  logLevel: info
  # e.g. redis://redis-master.ioc-enricher.svc:6379/0 ; empty = in-memory cache per pod
  redisUrl: ""

env: []
#  - name: LOG_LEVEL
#    value: info

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

containerPort: 8000

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: ioc-enricher.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

networkPolicy:
  enabled: true
  # Namespace label selector allowed to reach the pod (k3s traefik lives in kube-system)
  ingressFromNamespaces:
    - kube-system
  # Allow egress HTTPS to the internet for enrichment APIs (AbuseIPDB etc.)
  allowExternalEgress: true

# Prometheus Operator ServiceMonitor (requires the monitoring.coreos.com CRDs)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
